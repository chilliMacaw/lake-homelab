createClusterRoles: true
crds:
  install: true
  keep: true
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
  additionalLabels: {}

global:
  domain: argo.lakeops.de
  additionalLabels:
    app: argo-cd
  revisionHistoryLimit: 2
  imagePullSecrets: []
  networkPolicy:
    create: true
    defaultDenyIngress: false # TDOD fix once dfault policies exsist
  priorityClassName: "" # TODO platform-critical
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: arm64
  affinity:
    podAntiAffinity: soft
    nodeAffinity:
      type: hard
      matchExpressions:
        - key: kubernetes.io/hostname
          operator: NotIn
          values:
            - pier-01
            - pier-02
            - pier-03
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

configs:
  cm:
    create: true
  params:
    create: true
    annotations: {}
    server.insecure: "true"
  secret:
    createSecret: true

## Application controller
controller:
  name: application-controller
  replicas: 1

  resources: 
   limits:
     cpu: 200m
     memory: 384Mi
   requests:
     cpu: 50m
     memory: 128Mi

  readinessProbe:
    periodSeconds: 30

  metrics:
    enabled: true

dex:
  enabled: false

## Redis
redis:
  enabled: true

  resources: 
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  metrics:
    enabled: true

## Server
server:
  name: server
  replicas: 1

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  containerPorts:
    server: 8080
    metrics: 8083

  metrics:
    enabled: true

## Repo Server
repoServer:
  name: repo-server
  replicas: 1

  resources:
   limits:
     cpu: 200m
     memory: 256Mi
   requests:
     cpu: 20m
     memory: 64Mi
  containerPorts:
    server: 8081
    metrics: 8084
  metrics:
    enabled: true
 

## ApplicationSet controller
applicationSet:
  name: applicationset-controller
  replicas: 1

  metrics:
    enabled: true
    
  resources: 
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  containerPorts:
    metrics: 8080
    probe: 8081
    webhook: 7000

## Notifications controller TODO look into it later once monotoring is up
notifications:
  enabled: false
