---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - cluster

---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-egress-policy
spec:
  endpointSelector: {}

  egress:
    - toEntities:
        - cluster

---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-kube-system
spec:
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: kube-system

  ingress:
    - fromEntities:
        - cluster

  egress:
    - toEntities:
        - cluster

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-argocd-internal
  namespace: argocd
spec:
  endpointSelector: {}

  ingress:
    - fromEndpoints:
        - {}

  egress:
    - toEndpoints:
        - {}

---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-cilium-health
spec:
  endpointSelector:
    matchLabels:
      k8s-app: cilium

  ingress:
    - fromEntities:
        - remote-node

  egress:
    - toEntities:
        - remote-node


---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-hubble-relay
spec:
  endpointSelector:
    matchLabels:
      k8s-app: hubble-relay

  ingress:
    - fromEntities:
        - cluster

  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: cilium

      toPorts:
        - ports:
            - port: "4244"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-dns
spec:
  endpointSelector: {}

  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns

      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-internet-egress
  namespace: argocd
spec:
  endpointSelector: {}

  egress:
    - toEntities:
        - world

      toPorts:
        - ports:
            - port: "443"
              protocol: TCP